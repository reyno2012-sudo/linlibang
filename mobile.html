<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>邻里帮移动端首页</title>
    <link rel="stylesheet" href="./mobile.css" />
    <link rel="stylesheet" href="./mobile-components.css" />
  </head>
  <body>
    <main class="phone-app" id="app" aria-live="polite">
      <section class="screen active" id="screen-home"></section>
      <section class="screen" id="screen-assistant"></section>
      <section class="screen" id="screen-discover"></section>
      <section class="screen" id="screen-messages"></section>
      <section class="screen" id="screen-profile"></section>
    </main>

    <section class="compose-sheet" id="composeSheet" aria-label="发布邻里需求">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-title">
        <div>
          <p>邻里帮 Agent</p>
          <h2>发布邻里小事</h2>
        </div>
        <button type="button" class="round-close" id="closeCompose" aria-label="关闭发布面板">×</button>
      </div>
      <div class="compose-mode" role="group" aria-label="发布方式">
        <button type="button" class="active" data-compose-mode="manual">手动发布</button>
        <button type="button" data-compose-mode="agent">Agent 整理</button>
      </div>
      <div class="compose-type" role="group" aria-label="互助类型">
        <button type="button" data-compose-category="offer">帮助</button>
        <button type="button" class="active" data-compose-category="ask">求帮助</button>
        <button type="button" data-compose-category="chat">邻友圈</button>
      </div>
      <textarea id="mobileText" rows="4">今晚 7 点前帮我从小区门口取一个快递，送到 3 栋楼下，10 元以内。</textarea>
      <div class="mobile-assistant-sheet" id="mobileAssistantSheet" aria-live="polite"></div>
      <div class="preset-row" id="presetRow"></div>
      <button class="primary-action" id="mobileParse">发布</button>
    </section>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>

    <section class="profile-sheet" id="profileSheet" aria-label="编辑个人资料">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-title">
        <div>
          <p>个人资料</p>
          <h2>换头像和昵称</h2>
        </div>
        <button type="button" class="round-close" id="closeProfileEditor" aria-label="关闭个人资料面板">×</button>
      </div>
      <div class="profile-editor-preview">
        <button type="button" class="avatar-upload-preview" id="chooseAvatar" aria-label="上传头像">
          <span id="profileAvatarPreview">赵</span>
        </button>
        <div>
          <strong>上传自己的照片</strong>
          <p>系统会自动居中裁剪成圆形头像。</p>
        </div>
      </div>
      <input id="avatarInput" type="file" accept="image/*" hidden />
      <label class="input-field" for="profileNameInput">
        <span>昵称</span>
        <input id="profileNameInput" type="text" maxlength="12" value="小赵" />
      </label>
      <button class="primary-action" id="saveProfile">保存资料</button>
    </section>

    <section class="post-detail-sheet" id="postDetailSheet" aria-label="帖子详情" aria-live="polite"></section>

    <nav class="bottom-tabs" aria-label="移动端主导航">
      <button class="active" data-screen="home" type="button" aria-label="首页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v8.4a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 19.2z"/><path d="M9.2 21v-6.5h5.6V21"/></svg>
        <strong>首页</strong>
      </button>
      <button data-screen="assistant" type="button" aria-label="AI助手">
        <span class="ai-tab-icon">AI</span>
        <strong>助手</strong>
      </button>
      <button class="publish-tab" id="openCompose" type="button" aria-label="发布">
        <span class="publish-label">发布</span>
        <span class="publish-orb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button data-screen="discover" type="button" aria-label="发现">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2 5-4.8 1.8 2-5z"/></svg>
        <strong>发现</strong>
      </button>
      <button data-screen="profile" type="button" aria-label="我的">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
        <strong>我的</strong>
      </button>
    </nav>

    <script src="./mobile-data.js"></script>
    <script src="./mobile.js"></script>
  </body>
</html>
